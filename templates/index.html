<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>당신은 얼마나 정확한 원을 그릴 수 있나요?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">원 그리기 챌린지</span>
      </div>
    </header>

    <main class="stage">

      <!-- 메인 화면 -->
      <section id="screen-main" class="screen wide">
        <div class="bg-blobs" aria-hidden="true">
          <span class="blob blob-a"></span>
          <span class="blob blob-b"></span>
        </div>
        <div class="hero-layout">
          <div class="card demo-card">
            <div class="demo-result-score">정확도 <span class="demo-num">87.33</span>점</div>
            <div class="demo-result-canvas">
              <svg class="demo-anim" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <circle class="demo-fill" cx="150" cy="155" r="95"></circle>
                <path class="demo-stroke" d=""></path>
              </svg>
            </div>
          </div>
          <div class="card hero-card">
            <div class="hero-content">
              <span class="hero-badge">CIRCLE CHALLENGE</span>
              <h1 class="title">당신은 얼마나<br><span class="accent">정확한 원</span>을<br>그릴 수 있나요?</h1>
              <p class="hero-sub">마우스나 손가락으로 가장 완벽한 원에 도전해 보세요.</p>
              <div class="stat-strip">
                <div class="stat"><span class="stat-num" id="stat-count">-</span><span class="stat-label">총 기록</span></div>
                <div class="stat"><span class="stat-num" id="stat-best">-</span><span class="stat-label">최고 점수</span></div>
                <div class="stat"><span class="stat-num" id="stat-today">-</span><span class="stat-label">오늘 최고</span></div>
              </div>
              <div class="hero-actions">
                <button id="btn-start" class="btn-primary">시작하기</button>
              </div>
            </div>
          </div>
        </div>

        <div class="main-hall">
          <h2 class="section-title">명예의 전당</h2>
          <p id="empty-msg" class="empty-msg hidden">아직 기록이 없어요. 첫 도전자가 되어보세요!</p>
          <div class="hall-layout">
            <div class="card dark-card hall-left">
              <span class="card-label light">TOP 3</span>
              <canvas id="fireworks" class="fireworks"></canvas>
              <div id="podium" class="podium"></div>
            </div>
            <div class="card hall-right">
              <span class="card-label">전체 순위</span>
              <ol id="rank-list" class="rank-list"></ol>
            </div>
          </div>
        </div>
      </section>

      <!-- 등록 화면 -->
      <section id="screen-nickname" class="screen hidden">
        <div class="card form-card">
          <h2 class="subtitle">시작하기 전에</h2>
          <p class="muted">내 기록을 명예의 전당에 올릴 수 있어요.</p>

          <label class="consent">
            <input id="input-register" type="checkbox">
            <span>명예의 전당에 올리고 싶다면 체크해 주세요</span>
          </label>

          <div id="nickname-wrap" class="hidden">
            <input id="input-nickname" class="text-input" type="text" maxlength="20" placeholder="닉네임" autocomplete="off">
          </div>

          <div class="form-actions">
            <button id="btn-back-main" class="btn-secondary">뒤로</button>
            <button id="btn-confirm" class="btn-primary">확인</button>
          </div>
        </div>
      </section>

      <!-- 그리기 화면 -->
      <section id="screen-draw" class="screen hidden">
        <div class="card draw-card">
          <div class="draw-header">
            <span class="timer-label">남은 시간</span>
            <span id="timer" class="timer">20</span>
          </div>
          <canvas id="draw-canvas" class="draw-canvas"></canvas>
          <p class="draw-hint">한 번에 원을 그려보세요!</p>
        </div>
      </section>

      <!-- 결과 화면 -->
      <section id="screen-result" class="screen hidden">
        <div class="card result-card">
          <div id="result-accuracy" class="result-accuracy"></div>
          <canvas id="result-canvas" class="result-canvas"></canvas>
          <p id="result-comment" class="result-comment"></p>
          <p id="result-rank" class="result-rank"></p>
          <button id="btn-again" class="btn-primary">처음으로</button>
        </div>
      </section>

    </main>
  </div>
  <div id="clock" class="clock"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
